name: Build APK
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.github/workflows/dashboard.yml'
      - 'src/dashboard.jsx'
      - 'web/dashboard.html'
      - 'drive/**'
      - 'firebase/**'
      - 'test/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Isi konfigurasi Firebase (opsional, dari Secrets)
        run: |
          if [ -n "$FB_KEY" ] && [ -n "$FB_PROJECT" ]; then
            printf "export const FIREBASE_CONFIG = { apiKey: '%s', projectId: '%s' };\n" "$FB_KEY" "$FB_PROJECT" > src/config.js
          fi
        env:
          FB_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FB_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
      - run: npm install
      - run: npm run build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
      - run: npx cap add android
      - run: node tools/patch-android.mjs
      - run: npx cap sync android
      - name: Build APK (release, ditandatangani)
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Siapkan APK
        run: cp android/app/build/outputs/apk/release/*.apk PenilaianGudang.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PenilaianGudang-apk
          path: PenilaianGudang.apk
      - name: Terbitkan Release (dipakai pembaruan otomatis di aplikasi)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Pembaruan Penilaian Gudang (build ${{ github.run_number }}).
          files: PenilaianGudang.apk
